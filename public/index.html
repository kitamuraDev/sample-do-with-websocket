<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello, World!</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
      }
      .container {
        text-align: center;
        background-color: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      p {
        font-size: 1rem;
        margin-bottom: 1rem;
        color: #333;
      }
      input {
        padding: 10px 5px;
        font-size: 1rem;
        width: 80%;
        max-width: 300px;
        border: none;
        border-bottom: 1px solid #ccc;
        background-color: transparent;
        transition: border-bottom-color 0.3s, border-bottom-width 0.3s;
      }
      input:focus {
        outline: none;
        border-bottom-color: #3f51b5; /* Material Design blue */
        border-bottom-width: 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p id="message"></p>
      <input type="text" id="input" />
    </div>

    <script>
      const message = document.getElementById("message");
      const input = document.getElementById("input");

      let wsClient = new WebSocket("/ws");

      wsClient.addEventListener("open", (event) => {
        console.log(event)
      });

      wsClient.addEventListener("message", (event) => {
        message.textContent = event.data;
      });

      // 入力する度にwebsocketサーバーに送信
      input.addEventListener("input", (event) => {
        wsClient.send(event.target.value);
      });
    </script>
  </body>
</html>
